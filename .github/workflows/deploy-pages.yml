name: Deploy frontend to GitHub Pages

# Publishes the Vite build as a static site. The hackathon demo link is
# https://<owner>.github.io/1s5i5h/ -- note the /1s5i5h/ subpath, which
# vite.config.ts sets as `base` so assets and router paths resolve.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/samples/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a publish that is already serving the live link; let it finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Vite inlines VITE_* at build time, so these have to be exported as
      # environment variables during the build -- Pages configuration alone
      # cannot supply them, and there is no .env file on the runner.
      #
      # Anything VITE_-prefixed lands in the public JS bundle. A backend URL is
      # fine; a token would not be. See docs/deployment.md.
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      VITE_ENABLE_DEMO_FALLBACK: ${{ secrets.VITE_ENABLE_DEMO_FALLBACK || 'true' }}
      VITE_API_TIMEOUT_MS: ${{ secrets.VITE_API_TIMEOUT_MS || '30000' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: env.VITE_ENABLE_DEMO_FALLBACK == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # Skipped on a live deploy: with the fallback disabled the snapshot is never
      # read, and installing scikit-learn to regenerate an unused file would add
      # minutes to every publish. The `true` default keeps a fresh clone
      # self-sufficient -- no secrets configured means a working static demo.
      - name: Install backend
        if: env.VITE_ENABLE_DEMO_FALLBACK == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Regenerating from the samples keeps the published numbers real pipeline
      # output rather than something that has drifted from the code.
      - name: Export demo dataset
        if: env.VITE_ENABLE_DEMO_FALLBACK == 'true'
        working-directory: backend
        run: python scripts/export_demo_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npx vite build

      - name: Check the demo dataset shipped
        if: env.VITE_ENABLE_DEMO_FALLBACK == 'true'
        working-directory: frontend
        run: |
          test -f dist/demo-data.json || {
            echo "::error::dist/demo-data.json missing - the demo page would render empty"
            exit 1
          }
          echo "demo-data.json present"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4