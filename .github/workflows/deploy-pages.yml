name: Deploy frontend to GitHub Pages

# Publishes the Vite build as a static site. The hackathon demo link is
# https://<owner>.github.io/1s5i5h/ -- note the /1s5i5h/ subpath, which
# vite.config.ts sets as `base` so assets and router paths resolve.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/samples/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a publish that is already serving the live link; let it finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The static demo has no reachable backend, so demo-data.json ships with the
      # site. Regenerating it from the samples keeps the published numbers real
      # pipeline output rather than something that has drifted from the code.
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Export demo dataset
        working-directory: backend
        run: python scripts/export_demo_data.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npx vite build

      - name: Check the demo dataset shipped
        working-directory: frontend
        run: |
          test -f dist/demo-data.json || {
            echo "::error::dist/demo-data.json missing - the demo page would render empty"
            exit 1
          }
          echo "demo-data.json present"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4