config firewall address
    edit "net_internals"
        set subnet 10.10.10.0 255.255.255.0
    next
    edit "any"
        set subnet 0.0.0.0 0.0.0.0
    next
end
config firewall addrgrp
    edit "admins"
        set member "net_internals"
    next
end
config firewall service
    edit "SSH"
        set tcp-portrange 22 22
    next
    edit "ALL"
        set protocol ANY
    next
end
config firewall policy
    edit 1
        set name "mgmt-ssh-from-admin-net"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "net_internals"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "SSH"
        set logtraffic all
        set schedule-recurring "NONE"
    next
    edit 2
        set name "any-to-any-web"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "any"
        set dstaddr "any"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 3
        set name "dmz-outbound"
        set srcintf "port3"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end
config system global
    set hostname "FGT-EDGE-01"
    set admin-sport 8443
end
config system settings
    set admin-ssh-port 22
    set admin-telnet-port 23
    set admin-http-port 80
    set admin_https_port 443
end
config system interface
    edit "port1"
        set ip 203.0.113.5 255.255.255.0
        set allowaccess ping https ssh
        set description "WAN uplink"
    next
    edit "port2"
        set ip 10.10.10.5 255.255.255.0
        set allowaccess ping https ssh
        set description "Internal"
    next
    edit "port3"
        set ip 10.20.20.5 255.255.255.0
        set allowaccess ping
        set description "DMZ"
    next
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set passwd ENC xxxx
    next
    edit "netops"
        set accprofile "net_admin"
        set passwd ENC yyyy
    next
end
config system snmp syscommunity
    edit 1
        set name "public"
        config hosts
            edit 1
                set ip 10.10.10.50 32
            next
        end
    next
end
config log setting
    set fw-console-level 6
    set buffer 1
    set event-recorded yes
end
config router static
    edit 1
        set device "port1"
        set gateway 203.0.113.1
        set device-id "route1"
    next
end
