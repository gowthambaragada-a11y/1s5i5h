version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname CORE-SW-01
!
boot-start-marker
boot-end-marker
!
banner login ^C
Authorized access only. All activity is logged.
^C
!
no aaa new-model
!
ip access-list extended MGMT-IN
 remark Allow SSH only from the jump hosts
 permit tcp host 10.10.10.50 any eq 22
 permit tcp host 10.10.10.51 any eq 22
 deny   ip any any log
!
ip access-list extended OUTSIDE_IN
 permit tcp any host 192.168.1.10 eq 3389
 permit tcp any host 192.168.1.10 eq 445
 permit tcp any any eq 23
 permit udp any host 10.10.10.20 eq 161
 permit ip any any
!
ip access-list extended VTY-IN
 permit tcp 10.10.10.0 0.0.0.255 any eq 22
!
interface Loopback0
 description Router-ID
 ip address 10.255.0.1 255.255.255.255
!
interface GigabitEthernet0/0
 description Uplink-to-WAN
 ip address 203.0.113.5 255.255.255.0
 ip nat outside
 no shutdown
!
interface GigabitEthernet0/1
 description User-LAN
 ip address 10.10.10.1 255.255.255.0
 ip access-group MGMT-IN in
 no shutdown
!
interface GigabitEthernet0/2
 description Printer-VLAN
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet0/3
 description DMZ-Trunk
 switchport mode trunk
 switchport trunk allowed vlan 40,41-43
 no shutdown
!
interface GigabitEthernet0/4
 description Unused
 shutdown
!
ip ssh version 2
ip ssh timeout 60
ip ssh port 22
no ip domain-lookup
!
snmp-server community public RO
snmp-server community s3cr3t RW 10
snmp-server host 10.10.10.50 version 2c public
snmp-server location DC1-Rack-A12
!
line con 0
 exec-timeout 5 0
 logging synchronous
line vty 0 4
 exec-timeout 5 0
 transport input telnet ssh
 logging synchronous
!
ntp server 10.10.10.10
!
logging host 10.10.10.50
logging trap informational
logging buffered 4096
!
username netops privilege 7 password 7 121A0E041104
username admin privilege 15 secret 5 $1$mERr$XyZ0abcdefgh
username backup privilege 4 password 0 plaintext123
!
router ospf 1
 network 10.10.10.0 0.0.0.255 area 0
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
end
