[project]
name = "netguard-ai-backend"
version = "0.1.0"
description = "NETGUARD-AI - AI-Driven Multi-Vendor Network Security Compliance Auditor"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "defusedxml>=0.7",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "neo4j>=5.17",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "hier-config>=2.3",
    "ciscoconfparse2>=0.9",
    "structlog>=24.1",
    "httpx>=0.27",
    "orjson>=3.9",
]

[project.optional-dependencies]
llm = ["anthropic>=0.34", "tenacity>=8.2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.3", "mypy>=1.9"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = ["integration: requires live Postgres/Neo4j"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false
plugins = []
